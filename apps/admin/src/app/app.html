<main>
  <h1>Sonrisa alerts admin</h1>

  <mat-tab-group dynamicHeight>
    <mat-tab label="Events">
      <ng-template matTabContent>
        <p class="description">Inject a test event and watch what gets delivered.</p>
        <app-inject-event-form (created)="log.refresh()" />
        <app-delivery-log-table #log />
      </ng-template>
    </mat-tab>

    <mat-tab label="Rules">
      <ng-template matTabContent>
        <p class="description">Who gets notified about what, and where.</p>
        <app-rules-panel />
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</main>
